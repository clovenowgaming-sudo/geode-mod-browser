name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Android 64-bit
        uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          sdk: given
          target: Android64
      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vinz-Mod-Browser-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
